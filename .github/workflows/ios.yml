name: iOS

on:
  push:
    branches: ["**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (iOS 27 SDK when available)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: ConduitKit unit tests (crypto vector shared with the Windows host)
        working-directory: ios/ConduitKit
        run: swift test

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned, Release)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Conduit.xcodeproj -scheme Conduit -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: |BUILD (SUCCEEDED|FAILED)" | grep -v "appintentsmetadataprocessor" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package IPAs
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/Conduit.app
          test -d "$APP"
          mkdir -p ../out
          # Full build: includes the widget extension for the Dynamic Island (sideload / AltStore / TestFlight re-sign).
          rm -rf pkg && mkdir -p pkg/Payload && cp -R "$APP" pkg/Payload/
          (cd pkg && zip -qry ../../out/Conduit.ipa Payload)
          # LiveContainer build: app extensions can't run inside LiveContainer, so ship without PlugIns.
          rm -rf pkg && mkdir -p pkg/Payload && cp -R "$APP" pkg/Payload/ && rm -rf pkg/Payload/Conduit.app/PlugIns
          (cd pkg && zip -qry ../../out/Conduit-LiveContainer.ipa Payload)
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: Conduit-iOS
          path: out/*.ipa
          if-no-files-found: error
