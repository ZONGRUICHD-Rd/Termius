name: Windows

on:
  push:
    branches: ["**"]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Host core tests (protocol, crypto, adapters, end-to-end)
        run: dotnet test windows/tests/Conduit.Host.Core.Tests -c Release

  publish:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # WinUI's PRI/XAML packaging tasks ship with Visual Studio, not with the dotnet CLI — use VS MSBuild.
      - uses: microsoft/setup-msbuild@v2
      - name: Publish WinUI 3 app (unpackaged, self-contained)
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          $platform = if ($arch -eq "x64") { "x64" } else { "ARM64" }
          $dir = Join-Path $pwd "out/ConduitHost-win-$arch"
          msbuild windows/src/Conduit.Host/Conduit.Host.csproj /restore /t:Publish /m /v:minimal `
            /p:Configuration=Release /p:Platform=$platform /p:RuntimeIdentifier=win-$arch `
            /p:SelfContained=true /p:PublishDir="$dir/"
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed" }
          dotnet publish windows/src/Conduit.Host.Cli/Conduit.Host.Cli.csproj -c Release `
            -r win-$arch --self-contained true -p:PublishSingleFile=true -o "$dir/cli"
          if ($LASTEXITCODE -ne 0) { throw "cli publish failed" }
          if (!(Test-Path "$dir/ConduitHost.exe")) { throw "ConduitHost.exe missing" }
          Get-ChildItem $dir | Select-Object -First 30 | Format-Table Name, Length
          Compress-Archive -Path "$dir/*" -DestinationPath "out/ConduitHost-win-$arch.zip"
      - name: Smoke test — launch the app and check it stays up
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $dir = "out/ConduitHost-win-x64"
          if (!(Test-Path "$dir/ConduitHost.pri")) { throw "ConduitHost.pri missing — XAML would fail to load" }
          $env:CONDUIT_NO_DIALOG = "1"
          $log = Join-Path $env:LOCALAPPDATA "Conduit/crash.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process "$dir/ConduitHost.exe" -PassThru
          Start-Sleep -Seconds 25
          if (Test-Path $log) { Get-Content $log; throw "ConduitHost wrote a crash log" }
          if ($p.HasExited) { throw "ConduitHost exited after start (exit code $($p.ExitCode))" }
          $p.Refresh()
          "Window title: '$($p.MainWindowTitle)'"
          $r = Invoke-WebRequest http://127.0.0.1:47821/v1/ping -UseBasicParsing
          "Ping: $($r.Content)"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ConduitHost-win-${{ matrix.arch }}
          path: out/ConduitHost-win-${{ matrix.arch }}.zip
          if-no-files-found: error
