name: Release

# Push a tag like v1.0.0 → builds everything and publishes one GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.0.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  ios:
    uses: ./.github/workflows/ios.yml

  windows:
    uses: ./.github/workflows/windows.yml

  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Relay binaries
        run: |
          mkdir -p dist
          for rid in linux-x64 linux-arm64 win-x64; do
            dotnet publish relay/src/Conduit.Relay.csproj -c Release -r $rid --self-contained true \
              -p:PublishSingleFile=true -o out/conduit-relay-$rid
            (cd out/conduit-relay-$rid && zip -qr ../../dist/conduit-relay-$rid.zip .)
          done
          (cd relay && zip -qr ../dist/conduit-relay-docker.zip Dockerfile docker-compose.yml README.md src -x 'src/bin/*' 'src/obj/*')
      - name: Docker image → GHCR
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/conduit-relay
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t $IMAGE:$TAG -t $IMAGE:latest relay
          docker push $IMAGE:$TAG && docker push $IMAGE:latest
      - uses: actions/upload-artifact@v4
        with:
          name: relay
          path: dist/*

  publish:
    needs: [ios, windows, relay]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Conduit ${{ github.event.inputs.tag || github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
