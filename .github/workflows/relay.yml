name: Relay

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["relay/**", "windows/src/Conduit.Host.Core/**", "windows/tests/**", ".github/workflows/relay.yml"]
  pull_request:
    paths: ["relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build relay
        run: dotnet build relay/src -c Release
      - name: End-to-end through the relay (host ⇄ relay ⇄ phone client)
        run: |
          PORT=18080 dotnet relay/src/bin/Release/net8.0/conduit-relay.dll &
          for i in $(seq 1 40); do curl -fs localhost:18080/healthz && break; sleep 0.5; done
          CONDUIT_TEST_RELAY=ws://127.0.0.1:18080 dotnet test windows/tests/Conduit.Host.Core.Tests -c Release
      - name: Docker image
        run: docker build -t conduit-relay relay
      - name: Push image to GHCR (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/conduit-relay
          docker tag conduit-relay $IMAGE:${GITHUB_REF_NAME} && docker tag conduit-relay $IMAGE:latest
          docker push $IMAGE:${GITHUB_REF_NAME} && docker push $IMAGE:latest
